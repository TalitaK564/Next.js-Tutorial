<html>
  <head>
    <!-- Mapeia os identificadores 'react' e 'react-dom/client' para suas URLs em CDN -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev"
        }
      }
    </script>
  </head>
  <body>
    <!-- Ponto de montagem onde a árvore do React será injetada -->
    <div id="app"></div>

    <!-- 
      type="module" é obrigatório aqui:
      1. Permite o uso de 'import' / 'export' no navegador.
      2. Resolve os nomes 'react' e 'react-dom/client' via importmap.
    -->
    <script type="module">
      // 1. Importa a biblioteca base do React
      import React from 'react';

      // 2. Importa a função createRoot da API cliente do React 18+
      import { createRoot } from 'react-dom/client';

      // 3. Localiza o contêiner HTML na página
      const domNode = document.getElementById('app');

      // 4. Cria a raiz do React (Root) vinculada à div #app
      const root = createRoot(domNode);

      // 5. Renderiza a interface declarativa na tela
      root.render(<h1>Develop. Preview. Ship.</h1>);
    </script>
  </body>
</html>
