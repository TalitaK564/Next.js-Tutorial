<html>
  <head>
    <!-- 1. Import map: ensina o navegador a resolver os nomes 'react' e 'react-dom/client' via CDN -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev"
        }
      }
    </script>

    <!-- 2. Babel Standalone: compilador JavaScript carregado diretamente no navegador -->
    <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  </head>

  <body>
    <!-- Contêiner HTML onde a aplicação React será injetada -->
    <div id="app"></div>

    <!-- 
      Configurações críticas da tag de script:
      - type="text/babel": impede o navegador de rodar o script como JS puro (evitando erro no JSX) 
        e avisa ao Babel para interceptar e compilar este bloco.
      - data-type="module": instrui o Babel a tratar o código resultante como um Módulo ES nativo, 
        permitindo que o 'importmap' acima resolva os pacotes.
      - data-presets="react": ativa a transformação de sintaxe JSX para chamadas React.createElement/jsxRuntime.
    -->
    <script type="text/babel" data-type="module" data-presets="react">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      // Localiza o elemento contêiner
      const domNode = document.getElementById('app');

      // Inicializa a raiz do React 18+
      const root = createRoot(domNode);

      // O Babel converterá <h1>...</h1> em tempo de execução para JavaScript que o navegador entende
      root.render(<h1>Develop. Preview. Ship.</h1>);
    </script>
  </body>
</html>
